services:

  # ============================================================
  # 📊 ZOOKEEPER — coordinador interno de Kafka
  # No necesitas tocarlo — solo debe estar corriendo
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ligo-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper

  # ============================================================
  # 📊 KAFKA
  # Puerto 9092 → tu Spring Boot se conecta aquí
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ligo-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka

  # ============================================================
  # 🖥️ KAFKA UI — ver topics y mensajes en browser
  # http://localhost:8090
  # Equivalente al Management Console de RabbitMQ
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ligo-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ligo-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  zookeeper_data:
  kafka_data:
