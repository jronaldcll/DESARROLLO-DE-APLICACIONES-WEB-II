server:
  port: 8762

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-cuentas
          uri: lb://ms-cuentas
          predicates:
            - Path=/cuentas/**
        - id: ms-recargas
          uri: lb://ms-recargas
          predicates:
            - Path=/recargas/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
